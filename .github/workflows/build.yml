name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TeleprompterPiP.xcodeproj \
            -scheme TeleprompterPiP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          echo "APP_PATH=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TeleprompterPiP.ipa Payload
          ls -lh TeleprompterPiP.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TeleprompterPiP-unsigned
          path: TeleprompterPiP.ipa
          retention-days: 90
