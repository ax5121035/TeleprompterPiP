name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    # 2026-11-19 切换：macos-15-intel（Intel 池）连续 5 次 15 分钟拿不到机器，
    # 改到 macos-15（arm64 池）再试。
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show project info
        run: xcodebuild -list -project TeleprompterPiP.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TeleprompterPiP.xcodeproj \
            -scheme TeleprompterPiP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到 .app 产物，编译未成功"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH" | head -20
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TeleprompterPiP.ipa Payload
          ls -lh TeleprompterPiP.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TeleprompterPiP-unsigned
          path: TeleprompterPiP.ipa
          retention-days: 90
